# Pre-commit hooks for agent-sync
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Check for merge conflicts
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
        args: ['--always-fail']

  # Detect large files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']

  # Python syntax check
  - repo: https://github.com/pycqa/pygrep-primary
    rev: v1.0.0
    hooks:
      - id: python-no-logging-format
      - id: python-no-eval

  # Run tests before commit (skip slow tests)
  - repo: local
    rev: v0.0.1
    hooks:
      - id: run-tests
        name: Run Tests
        entry: python -m pytest tests/ -x -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Lint Python files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format