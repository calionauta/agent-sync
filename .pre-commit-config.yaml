# Pre-commit hooks for agent-sync
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Check for merge conflicts
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
        args: ['--always-fail']

  # Detect large files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']

  # Python syntax check
  # NOTE: pygrep-primary was removed — repo no longer exists upstream. Use
  # ruff for additional checks if needed.

  # Run tests before commit (skip slow tests)
  - repo: local
    hooks:
      - id: run-tests
        name: Run Tests
        # Use the venv python explicitly so pre-commit exercises local source
        # edits, not the system-installed agent_sync package. See AGENTS.md
        # Dev Workflow section.
        entry: .venv/bin/python -m pytest tests/ -x -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Lint Python files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format