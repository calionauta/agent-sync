# agent-sync - Global Agent Registry
# --------------------------------------
# This file defines how each AI agent integration works.
#
# DotAgents Protocol Alignment (https://dotagentsprotocol.com/)
# --------------------------------------------------------------
# The protocol defines ~/.agents/ as the canonical global directory for
# AI agent configs: skills/, agents/, mcp.json, config.json.
#
# agent-sync extends this by:
# - Using ~/.agents/skills/ as the skill hub (DotAgents-compatible)
# - Supporting per-agent configs (vendor-neutral)
# - Centralizing skills from agents using ~/.agents/skills/ as source of truth
#
# SCHEMA:
#   type:
#     - ide: VS Code extensions (roocode, cursor, windsurf, cline)
#     - cli: Command-line agents (claude-code, opencode, gemini-cli, pi.dev, qwen-code)
#
#   method:
#     - native: Agent reads directly from ~/.agents/skills/ (DotAgents native)
#     - config: Agent supports custom skill paths in its own config file
#     - copy:   Fallback method. agent-sync copies skills to the agent's folder
#
#   skills_dir_name: The folder name where the agent expects skills (tools/commands)
#
#   agents_dir_name: (Optional) The folder name where the agent stores custom agents
#   agents_dir_global: (Optional) Global directory for user-wide custom agents
#
#   check: How to detect if the agent is installed
#     - binary: Check if a command exists in PATH
#     - path:   Check if a specific file exists
#     - always: true (for internal components)
#
#   config_update (required for method: config):
#     - path: Dot-notation to the key in the JSON config (e.g., "skills.paths")
#     - action: "append" (for lists) or "set" (for single values)
#
#   extra_paths (optional): Additional folders to sync (used by pi.dev)

opencode:
  type: cli
  method: config
  config_dir: "~/.config/opencode"
  config_filename: "opencode.json"
  config_patterns: ["*.json", "*.jsonc", "AGENTS.md", "SYSTEM.md"]
  skills_dir_name: "skills"
  agents_dir_name: "agents"
  agents_dir_global: "~/.config/opencode/agents"
  check:
    binary: "opencode"
  config_update:
    path: "skills.paths"
    action: append

claude-code:
  type: cli
  method: copy
  config_dir: "~/.claude"
  config_filename: "settings.json"
  config_patterns: ["*.json", "AGENTS.md", "SYSTEM.md", "CLAUDE.md"]
  skills_dir_name: "commands"
  agents_dir_name: "agents"
  agents_dir_global: "~/.claude/agents"
  check:
    binary: "claude"

gemini-cli:
  type: cli
  method: copy
  config_dir: "~/.gemini"
  config_filename: "settings.json"
  config_patterns: ["*.json", "AGENTS.md", "SYSTEM.md", "GEMINI.md"]
  skills_dir_name: "tools"
  check:
    binary: "gemini"

pi.dev:
  type: cli
  method: native
  config_dir: "~/.pi/agent"
  config_filename: "settings.json"
  config_patterns: ["*.json", "*.yaml", "AGENTS.md", "SYSTEM.md"]
  skills_dir_name: "skills"
  check:
    path: "~/.pi/agent/settings.json"
  extra_paths:
    # NOTE: pi.dev migrated from flat ~/.pi/ to ~/.pi/agent/ (commit 4faa0f9).
    # On this machine, ~/.pi/extensions and ~/.pi/themes are symlinks to
    # ~/.pi/agent/{extensions,themes} — single source of truth, no drift.
    # All keys below are wired to code via Agent._get_extra_paths() — do not
    # remove.
    # Configurações principais em ~/.pi/agent/
    extensions: ["~/.pi/agent/extensions"]
    prompts: ["~/.pi/agent/prompts", "~/.pi/prompts"]  # prompts shared at root, not symlinked
    themes: ["~/.pi/agent/themes"]
    # Outros diretivos e arquivos importantes
    bin: ["~/.pi/agent/bin"]
    git: ["~/.pi/agent/git"]
    lsp: ["~/.pi/agent/lsp-settings.json"]
    models: ["~/.pi/agent/models.json"]
    # Diretórios globais em ~/.pi/ (fora de ~/.pi/agent/) — compat layer
    global_prompts: ["~/.pi/prompts"]  # shared content at root
    global_skills_local: ["~/.pi/skills"]  # legacy: hub moved to ~/.agents/skills/ per DotAgents
    # Arquivos na raiz de ~/.pi/
    pyrightconfig: ["~/.pi/pyrightconfig.json"]  # legacy root file: still has content

qwen-code:
  type: cli
  method: copy
  config_dir: "~/.qwen"
  config_filename: "settings.json"
  config_patterns: ["*.json", "AGENTS.md", "SYSTEM.md", "output-language.md"]
  skills_dir_name: "skills"
  check:
    binary: "qwen"

global-skills:
  method: native
  skills_dir_name: "skills"
  check:
    always: true

# =============================================================================
# VS Code Extensions & IDE Agents
# =============================================================================
# DotAgents Protocol: These agents increasingly support ~/.agents/skills/ natively.
# The "native" method means they read directly from the DotAgents hub,
# no copying needed. This aligns with the protocol's "one directory" vision.

roocode:
  type: ide
  method: native
  config_dir: "~/.roo"
  config_filename: "custom_modes.yaml"
  config_patterns: ["*.yaml", "*.json", "*.md"]
  skills_dir_name: "skills"
  check:
    path: "~/.roo/custom_modes.yaml"
  notes: "Native support for ~/.agents/skills/ (higher priority than ~/.roo/skills/)"
  mode_specific: true  # Supports skills-code/, skills-architect/, etc.
  migrate_from: "~/.roo/skills/"
  extra_paths:
    # Global rules directory (~/.roo/rules/) — agent instructions compartilhadas
    rules: ["~/.roo/rules"]

cline:
  type: ide
  method: copy
  config_dir: "~/.cline"
  config_filename: "state.json"
  config_patterns: ["*.md", "*.json"]
  skills_dir_name: "skills"
  check:
    binary: "cline"
  # Copy from project skills directories to global hub
  copy_from:
    - ".cline/skills/"
    - ".clinerules/skills/"
    - ".claude/skills/"
  copy_to: "~/.agents/skills/"

cursor:
  type: ide
  method: native
  config_dir: "~/.cursor"
  config_filename: "settings.json"
  config_patterns: ["*.md"]
  skills_dir_name: "skills"
  check:
    binary: "cursor"
  notes: "Native support for ~/.agents/skills/ (project and global)"
  migrate_from:
    - ".cursor/skills/"
    - "~/.cursor/skills/"

windsurf:
  type: ide
  method: copy
  config_dir: "~/.codeium/windsurf"
  config_filename: "config.json"
  config_patterns: ["*.md"]
  skills_dir_name: "skills"
  check:
    binary: "windsurf"
  # Copy from project/global skills directories to global hub
  copy_from:
    - ".windsurf/skills/"
    - "~/.codeium/windsurf/skills/"
  copy_to: "~/.agents/skills/"
