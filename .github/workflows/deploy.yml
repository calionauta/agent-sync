name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r docs/requirements.txt
          pip install --no-cache-dir -e .

      - name: Generate CLI documentation
        run: |
          python scripts/generate_cli_docs.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build documentation
        run: mkdocs build --strict --site-dir site_docs

      - name: Create deployment directory
        run: |
          # Step 1: Copy main site (index.html) to root
          cp index.html _site/
          
          # Step 2: Create docs directory
          mkdir -p _site/docs
          
          # Step 3: Copy MkDocs output to /docs (excluding index.html to avoid overwrite)
          for item in site_docs/*; do
            filename=$(basename "$item")
            if [ "$filename" != "index.html" ]; then
              cp -r "$item" _site/docs/
            fi
          done
          
          # Step 4: Rename docs index to avoid conflict
          mv site_docs/index.html _site/docs/home.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4