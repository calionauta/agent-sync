name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r docs/requirements.txt
          pip install --no-cache-dir -e .

      - name: Generate CLI documentation
        run: |
          python scripts/generate_cli_docs.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build documentation
        run: mkdocs build --strict --site-dir site_docs

      - name: Create deployment directory
        run: |
          # Create root directory
          mkdir -p _site
          
          # Copy main site to root (this is the landing page)
          cp index.html _site/
          
          # Create docs directory
          mkdir -p _site/docs
          
          # Copy all site_docs content to /docs (except index.html which conflicts)
          for item in site_docs/*; do
            filename=$(basename "$item")
            if [ "$filename" = "index.html" ]; then
              # Rename docs index to home.html
              cp "$item" _site/docs/home.html
            elif [ "$filename" = "404.html" ]; then
              # Copy 404.html for docs subfolder
              cp "$item" _site/docs/404.html
            else
              cp -r "$item" _site/docs/
            fi
          done
          
          # List structure for debug
          echo "=== Root structure ==="
          ls -la _site/
          echo ""
          echo "=== Docs structure ==="
          ls -la _site/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4