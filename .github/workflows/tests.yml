name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -e ".[dev]"

    - name: Run tests
      run: |
        pytest -o "addopts=-v" --cache-clear

    # Lint was previously only enforced by the local pre-commit hook, which
    # anyone could bypass with --no-verify, and did: the suite had drifted to
    # 342 findings before this gate existed. Run it here so a clean tree is
    # required to merge, not merely encouraged.
    - name: Lint (ruff)
      if: matrix.python-version == '3.12'
      run: |
        ruff check .
        ruff format --check .
